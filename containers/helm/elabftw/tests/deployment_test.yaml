suite: web deployment
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/secret.yaml
tests:
  - it: renders a Deployment for the web component
    template: templates/deployment.yaml
    set:
      secrets.secretKey: test-key
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: web

  - it: uses the elabimg image with the configured tag
    template: templates/deployment.yaml
    set:
      secrets.secretKey: test-key
      image.repository: elabftw/elabimg
      image.tag: "5.3.4"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: elabftw/elabimg:5.3.4

  - it: grants NET_BIND_SERVICE so nginx can bind port 443
    template: templates/deployment.yaml
    set:
      secrets.secretKey: test-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          content: NET_BIND_SERVICE
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: probe scheme is HTTPS when DISABLE_HTTPS is false
    template: templates/deployment.yaml
    set:
      secrets.secretKey: test-key
      web.env.DISABLE_HTTPS: "false"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.scheme
          value: HTTPS
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.scheme
          value: HTTPS
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthcheck

  - it: probe scheme is HTTP when DISABLE_HTTPS is true (default)
    template: templates/deployment.yaml
    set:
      secrets.secretKey: test-key
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.scheme
          value: HTTP
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.scheme
          value: HTTP
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.scheme
          value: HTTP

  - it: waits for mysql via an init container when mysql is enabled
    template: templates/deployment.yaml
    set:
      secrets.secretKey: test-key
      mysql.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-mysql

  - it: has no init container when mysql is disabled
    template: templates/deployment.yaml
    set:
      secrets.secretKey: test-key
      mysql.enabled: false
      web.env.DB_HOST: external-db.example.com
    asserts:
      - isNull:
          path: spec.template.spec.initContainers

  - it: mounts the uploads volume by default
    template: templates/deployment.yaml
    set:
      secrets.secretKey: test-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: uploads
            mountPath: /elabftw/uploads

  - it: honours replicaCount when autoscaling is disabled
    template: templates/deployment.yaml
    set:
      secrets.secretKey: test-key
      replicaCount: 2
      autoscaling.enabled: false
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: omits replicas when autoscaling is enabled
    template: templates/deployment.yaml
    set:
      secrets.secretKey: test-key
      autoscaling.enabled: true
    asserts:
      - isNull:
          path: spec.replicas
