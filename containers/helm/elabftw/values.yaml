# Default values for the eLabFTW Helm chart.
# This mirrors the official docker-compose configuration
# (https://get.elabftw.net/?config) adapted for Kubernetes.
#
# Every value maps to an environment variable documented in
# containers/elabimg/README.md and the upstream compose file.

# -- String to partially override the fullname template (release-name-elabftw)
nameOverride: ""
# -- String to fully override the fullname template
fullnameOverride: ""

# -- Number of eLabFTW web replicas.
# NOTE: if you run more than one replica you MUST enable Redis (redis.enabled or
# an external redis via web.env.USE_REDIS) so PHP sessions are shared, otherwise
# users will be logged out at random. See values under `redis`.
replicaCount: 1

image:
  # -- eLabFTW (elabimg) image repository
  repository: elabftw/elabimg
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Overrides the chart appVersion when set.
  # Prefer pinning an explicit version (e.g. "5.3.4") in production.
  tag: "stable"

# -- Image pull secrets for private registries
imagePullSecrets: []

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Name of the ServiceAccount to use. Generated if empty and create is true.
  name: ""

# -- Extra annotations for the web Deployment pods
podAnnotations: {}
# -- Extra labels for the web Deployment pods
podLabels: {}

# Pod-level security context.
# The elabimg entrypoint needs to chown files, so it starts as root and drops
# privileges internally to ELABFTW_USERID/GROUPID (default 101). Do not force
# runAsNonRoot unless you also configure a pre-baked, correctly-owned image.
podSecurityContext: {}

# Container-level security context, mirroring the docker-compose cap_drop/cap_add
# and no-new-privileges settings.
# NET_BIND_SERVICE is required because nginx binds to the privileged port 443.
# Without it you get: nginx: [emerg] bind() to 0.0.0.0:443 failed (13: Permission denied)
# (In plain Docker the root user keeps this capability implicitly; under
# Kubernetes with allowPrivilegeEscalation:false it must be granted explicitly.)
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - SETGID
      - SETUID
      - FOWNER
      - DAC_OVERRIDE
      - NET_BIND_SERVICE

service:
  # -- Service type for the web application
  type: ClusterIP
  # -- Service port exposed to the cluster
  port: 443
  # -- Target container port. elabimg always listens on 443 internally
  # (even when DISABLE_HTTPS=true, in which case it serves plain HTTP on 443).
  targetPort: 443
  # -- Extra annotations for the Service
  annotations: {}

ingress:
  # -- Enable an Ingress for the web service. Disabled by default; you must opt
  # in explicitly. TLS is expected to be terminated here (see web.env.DISABLE_HTTPS,
  # which defaults to "true").
  enabled: false
  # -- IngressClass name. Defaults to "nginx" when left empty.
  className: ""
  # -- Ingress annotations. Because DISABLE_HTTPS defaults to "true", TLS is
  # terminated at the ingress and the backend is plain HTTP, so you do NOT need a
  # backend-protocol annotation. Only set backend-protocol: "HTTPS" if you flip
  # DISABLE_HTTPS to "false" and have elabimg serve HTTPS itself.
  annotations: {}
    # nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
  # -- Host rules. REQUIRED when ingress.enabled is true (there is no implicit
  # fallback). Rendering fails if this is empty while the ingress is enabled.
  hosts: []
    # - host: elab.example.org
    #   paths:
    #     - path: /
    #       pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
    # - secretName: elabftw-tls
    #   hosts:
    #     - elab.example.org

# -- Resource requests/limits for the web container.
# eLabFTW needs at least 512Mi (1Gi recommended). Keep limits generous because
# PDF/archive exports are memory hungry (see MAX_PHP_MEMORY).
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

autoscaling:
  # -- Enable a HorizontalPodAutoscaler for the web deployment.
  # Requires Redis-backed sessions (see note on replicaCount).
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Node selector for the web pods
nodeSelector: {}
# -- Tolerations for the web pods
tolerations: []
# -- Affinity rules for the web pods
affinity: {}

# Liveness/readiness/startup probes hit the elabimg /healthcheck endpoint,
# which replies 204 when nginx is up (see containers/elabimg/nginx/healthcheck.sh).
# The scheme follows web.env.DISABLE_HTTPS automatically in the template.
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startup:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30

# Persistent storage for uploads and exports.
persistence:
  uploads:
    # -- Persist uploaded files at /elabftw/uploads (docker-compose: /var/elabftw/web)
    enabled: true
    # -- Keep the PVC on `helm uninstall` (adds helm.sh/resource-policy: keep).
    # Uploads are user data, so this defaults to true to prevent accidental loss.
    # The PVC (and its data) must then be deleted manually if you really want it gone.
    retain: true
    # -- Use an existing PVC instead of creating one
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations: {}
  exports:
    # -- Persist exported files at /elabftw/exports (optional bind mount in compose)
    enabled: false
    # -- Keep the PVC on `helm uninstall`. Exports are regenerable, so this
    # defaults to false; set true to preserve them.
    retain: false
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    annotations: {}

# ---------------------------------------------------------------------------
# eLabFTW web container configuration.
# These map 1:1 to the environment variables from the official compose file.
# Only non-secret defaults are shown here; secrets live under `secrets` below.
# ---------------------------------------------------------------------------
web:
  env:
    # --- MySQL connection ---
    # DB_HOST defaults to the in-cluster mysql service when mysql.enabled=true.
    # Set explicitly here to point at an external database.
    DB_HOST: ""
    DB_PORT: "3306"
    DB_NAME: elabftw
    DB_USER: elabftw
    # DB_PASSWORD comes from secrets.dbPassword (see below)
    # DB_CERT_PATH: /mysql-cert/cert.pem

    # --- PHP ---
    PHP_TIMEZONE: Europe/Paris
    TZ: Europe/Paris
    # PHP_MAX_CHILDREN: "50"
    # PHP_MAX_EXECUTION_TIME: "120"
    MAX_PHP_MEMORY: 2G

    # --- eLabFTW ---
    # SECRET_KEY comes from secrets.secretKey (see below)
    # SITE_URL is the canonical user-facing URL, e.g. https://elab.uni.edu:3148
    SITE_URL: ""
    MAX_UPLOAD_SIZE: 100M
    MAX_UPLOAD_TIME: "900000"
    # ELAB_AWS_ACCESS_KEY / ELAB_AWS_SECRET_KEY come from secrets if using S3

    # --- nginx ---
    SERVER_NAME: localhost
    # Defaults to "true": TLS is terminated at the Ingress/LoadBalancer in front
    # and elabimg serves plain HTTP on port 443. Set to "false" only if you want
    # elabimg to serve HTTPS itself (then also configure certs + ingress
    # backend-protocol: "HTTPS").
    DISABLE_HTTPS: "true"
    ENABLE_LETSENCRYPT: "false"
    # ENABLE_IPV6: "false"
    # SET_REAL_IP: "false"
    # SET_REAL_IP_FROM: "10.0.0.0/8"
    # USE_PERSISTENT_MYSQL_CONN: "true"
    # NGINX_WORK_PROC: auto
    # ALLOW_ORIGIN: ""
    # ALLOW_METHODS: ""
    # ALLOW_HEADERS: ""
    # KEEPALIVE_TIMEOUT: 10s

    # --- Redis (session storage) ---
    # Managed automatically when redis.enabled=true. Override for external redis.
    # USE_REDIS: "false"
    # REDIS_HOST: redis
    # REDIS_PORT: "6379"
    # REDIS_USERNAME: ""
    # REDIS_PASSWORD comes from secrets.redisPassword

    # --- LDAP ---
    # LDAP_TLS_REQCERT: "false"

    # --- Misc ---
    # SILENT_INIT: "false"
    # NOTE: schema install/upgrade is handled by the dbInit hook Job (see the
    # `dbInit` section below), which runs `bin/init` once per release to avoid
    # multiple web replicas racing. Prefer that over AUTO_DB_INIT/AUTO_DB_UPDATE.
    # These per-container flags remain available if you disable the Job.
    # AUTO_DB_INIT: "false"
    # AUTO_DB_UPDATE: "false"
    # DEMO_MODE: "false"
    # MAINTENANCE_MODE: "false"
    # CUSTOM_CONNECT_SRC: ""

    # --- Plugins ---
    # USE_INDIGO: "false"
    # INDIGO_URL: http://chem-plugin:8080/
    # USE_FINGERPRINTER: "false"
    # FINGERPRINTER_URL: http://chem-plugin:8000/
    # FINGERPRINTER_USE_PROXY: "false"
    # USE_OPENCLONING: "false"
    # OPENCLONING_URL: http://opencloning-plugin:8000/

    # --- Development ---
    # Set to "true" only in a dev environment. See containers/elabimg/README.md.
    # DEV_MODE: "false"

  # -- Extra raw environment variables (list of {name,value} or {name,valueFrom})
  extraEnv: []

  # -- Mount an existing Secret/ConfigMap as env via envFrom
  extraEnvFrom: []

  # -- Extra volumes for the web pod (e.g. TLS certs, mysql-cert)
  extraVolumes: []
  # -- Extra volume mounts for the web container
  extraVolumeMounts: []

# ---------------------------------------------------------------------------
# Database schema initialization / migration.
# This uses the elabimg image's built-in mechanism: the container entrypoint
# templates php.ini/php-fpm config and THEN runs the schema commands, so it
# works correctly (a standalone `bin/init` call would skip that templating and
# fail on open_basedir/memory_limit). See containers/elabimg/entrypoint.
#
# init:    runs `bin/init db:install` on container start (idempotent; installs
#          the schema on a fresh database, no-op if already present).
# migrate: runs `db:update` on container start to apply pending migrations.
#
# NOTE: these run on every web pod. With a single replica (the default) there
# is no contention. If you scale to multiple replicas, roll out one at a time
# (the default RollingUpdate maxSurge:1/maxUnavailable:0 does this) so pods do
# not run migrations concurrently, or run the schema commands manually and set
# both to false:
#   kubectl exec deploy/<release>-elabftw -c web -- bin/init db:install
# ---------------------------------------------------------------------------
dbInit:
  # -- Install the schema on container start (sets AUTO_DB_INIT=true)
  init: true
  # -- Apply pending migrations on container start (sets AUTO_DB_UPDATE=true)
  migrate: true

# ---------------------------------------------------------------------------
# Secrets. By default the chart generates a Secret from these values.
# For production, set create: false and reference an existingSecret you manage
# out-of-band (e.g. via sealed-secrets / external-secrets).
# ---------------------------------------------------------------------------
secrets:
  # -- Create the Secret from the values below
  create: true
  # -- Use an existing Secret instead of creating one. Must contain the keys:
  # DB_PASSWORD, SECRET_KEY, and (if used) REDIS_PASSWORD,
  # ELAB_AWS_ACCESS_KEY, ELAB_AWS_SECRET_KEY, STATUS_PASSWORD.
  existingSecret: ""

  # -- MySQL password for the elabftw DB user. MUST match mysql.auth.password.
  dbPassword: "changeme-db-password"
  # -- eLabFTW SECRET_KEY. Generate with:
  # docker run --rm -t --entrypoint '/bin/sh' elabftw/elabimg \
  #   -c "php -d memory_limit=10M -d open_basedir='' bin/init tools:genkey"
  # or fetch from https://get.elabftw.net/?key
  secretKey: ""
  # -- Optional Redis password
  redisPassword: ""
  # -- Optional S3 credentials
  awsAccessKey: ""
  awsSecretKey: ""
  # -- Optional password for /php-status and /nginx-status endpoints
  statusPassword: ""

# ---------------------------------------------------------------------------
# Bundled MySQL database (mysql:8.4 as in docker-compose).
# Disable and point web.env.DB_HOST at an external server for production HA.
# ---------------------------------------------------------------------------
mysql:
  # -- Deploy an in-cluster MySQL 8.4 StatefulSet
  enabled: true
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  auth:
    # -- Root password (MYSQL_ROOT_PASSWORD)
    rootPassword: "changeme-root-password"
    database: elabftw
    username: elabftw
    # -- User password (MYSQL_PASSWORD). MUST match secrets.dbPassword.
    password: "changeme-db-password"
  # -- Timezone (TZ), keep in sync with web.env.TZ
  timezone: Europe/Paris
  service:
    port: 3306
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - AUDIT_WRITE
        - MKNOD
        - SYS_CHROOT
        - SETFCAP
        - NET_RAW
      add:
        - SYS_NICE
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Bundled Redis for PHP session storage (redis:7-alpine as in docker-compose).
# REQUIRED when replicaCount > 1 or autoscaling is enabled.
# ---------------------------------------------------------------------------
redis:
  # -- Deploy an in-cluster Redis and wire USE_REDIS/REDIS_HOST automatically
  enabled: false
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  persistence:
    enabled: false
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
