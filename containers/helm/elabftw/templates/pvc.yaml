    app.kubernetes.io/component: web
  {{- if or .Values.persistence.exports.retain .Values.persistence.exports.annotations }}
  annotations:
    {{- if .Values.persistence.exports.retain }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.exports.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.exports.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.exports.size | quote }}
  {{- if .Values.persistence.exports.storageClass }}
